<div class="stat-card card card-hover p-3.5 sm:p-5 h-full" *ngIf="!loading; else skeleton">
  <div class="flex items-start justify-between gap-2 sm:gap-3">
    <div class="min-w-0 flex-1">
      <p class="text-xs sm:text-[13px] text-gray-500 font-semibold mb-1 sm:mb-2 truncate">{{ data.title }}</p>
      <p #valueEl class="stat-value font-extrabold text-gray-900 leading-tight truncate tracking-tight">
        <ng-container *ngIf="numeric; else plainValue">
          {{ data.prefix }}{{ data.value | number }}{{ data.suffix }}
        </ng-container>
        <ng-template #plainValue>{{ data.prefix }}{{ data.value }}{{ data.suffix }}</ng-template>
      </p>
      <p
        *ngIf="data.change"
        class="mt-1.5 sm:mt-2.5 text-[0.6875rem] sm:text-xs font-bold inline-flex items-center gap-1 px-1.5 sm:px-2 py-0.5 rounded-full max-w-full"
        [class.trend-up]="data.changeType === 'up'"
        [class.trend-down]="data.changeType === 'down'"
        [class.trend-neutral]="data.changeType === 'neutral' || !data.changeType"
      >
        <span class="material-symbols-outlined text-[13px] sm:text-[14px]">
          {{ data.changeType === 'down' ? 'trending_down' : 'trending_up' }}
        </span>
        <span class="truncate">{{ data.change }}</span>
      </p>
    </div>
    <div
      class="stat-icon shrink-0"
      [class.stat-icon-warn]="data.changeType === 'down'"
    >
      <span class="material-symbols-outlined">{{ data.icon }}</span>
    </div>
  </div>
</div>

<ng-template #skeleton>
  <div class="card p-3.5 sm:p-5 h-full">
    <div class="skeleton h-3.5 w-20 mb-3"></div>
    <div class="skeleton h-6 sm:h-8 w-24 sm:w-32 mb-3"></div>
    <div class="skeleton h-3 w-16"></div>
  </div>
</ng-template>
